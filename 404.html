<style>
  :root { --bg: #f5f2f9; --ink: #1f1830; --quiet: #8a7fa3; color-scheme: light; }

  }

  .code { font: 700 11px/1 "Space Mono", ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: #7b2ff2; margin: 18px 0 10px; }
