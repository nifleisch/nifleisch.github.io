<style>
  :root { --bg: #f5f2f9; --ink: #1f1830; --quiet: #8a7fa3; --line: rgba(31, 24, 48, .14); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { touch-action: none; background: radial-gradient(120% 90% at 50% 38%, #fbf9fd 0%, var(--bg) 55%, #ece6f4 100%); }
  /* the style zones stay, invisible: wherever the cursor is decides the look */
  #zones { position: fixed; inset: 0; display: grid; pointer-events: none; visibility: hidden; }
  main { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
  /* the creature also shrinks with the window height, so the name, links and projects button always fit
     (phones in landscape, short laptop windows); the page itself never scrolls */
  #figure { position: relative; width: clamp(120px, calc(100vh - 290px), min(58vmin, 500px, 92vw)); aspect-ratio: 1; margin-top: -4vh; flex: none; }
  @supports (height: 100svh) { #figure { width: clamp(120px, calc(100svh - 290px), min(58vmin, 500px, 92vw)); } }
  @media (max-height: 480px) { #figure { margin-top: 0; } }
  #figure canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .who { text-align: center; margin-top: -1.5vmin; position: relative; z-index: 2; }
  h1 { font: 700 clamp(26px, 4.6vmin, 42px)/1.1 "Space Mono", ui-monospace, monospace; letter-spacing: -.02em; margin: 0; }
  .eyebrow { font: 700 11px/1 "Space Mono", ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: #7b2ff2; margin-bottom: 10px; }
  .role { color: var(--quiet); font-size: 14px; margin-top: 6px; }
  .links { display: flex; gap: 22px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .links a { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px;
    padding: 4px 0; border-bottom: 1px solid var(--line); transition: border-color .2s, color .2s; }
  .links a:hover, .links a:focus-visible { border-color: #7b2ff2; color: #5b1fc2; outline: none; }
  .links svg { width: 16px; height: 16px; flex: none; }
  /* projects get their own line: monospace, and the label glitches on hover */
  .projects { display: inline-block; margin-top: 16px; font: 700 12px/1 "Space Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
    color: #7b2ff2; text-decoration: none; padding: 8px 12px; border: 1px dashed rgba(123, 47, 242, .45); border-radius: 4px; transition: background .2s, border-color .2s; }
  .projects b { display: inline-block; transition: transform .25s; }
  .projects span { position: relative; display: inline-block; }
  .projects:hover, .projects:focus-visible { background: rgba(123, 47, 242, .08); border-style: solid; outline: none; }
  .projects:hover b { transform: translateX(4px); }
  .projects:hover span::before, .projects:hover span::after { content: attr(data-t); position: absolute; inset: 0; animation: tglitch .5s steps(2) infinite; }
  .projects:hover span::before { color: #ff005a; transform: translate(-2px, 0); clip-path: inset(0 0 55% 0); }
  .projects:hover span::after { color: #00beff; transform: translate(2px, 0); clip-path: inset(50% 0 0 0); animation-delay: -.25s; }
  @keyframes tglitch { 0% { clip-path: inset(0 0 60% 0); } 25% { clip-path: inset(40% 0 20% 0); } 50% { clip-path: inset(70% 0 0 0); } 75% { clip-path: inset(10% 0 70% 0); } 100% { clip-path: inset(0 0 60% 0); } }
  @media (prefers-reduced-motion: reduce) { .projects:hover span::before, .projects:hover span::after { animation: none; } }
  @media (max-width: 380px) { .links { gap: 14px; } }      /* keeps all four links on one line on small phones */
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--quiet); }
  #edit { display: none; }
</style>
